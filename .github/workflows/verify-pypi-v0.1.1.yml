name: Verify PyPI v0.1.1

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Verify clean install, metadata and long description
        run: |
          python -m venv /tmp/invoicecraftly-pypi-011
          /tmp/invoicecraftly-pypi-011/bin/python -m pip install --upgrade pip
          /tmp/invoicecraftly-pypi-011/bin/python -m pip install --no-cache-dir --index-url https://pypi.org/simple invoicecraftly==0.1.1
          /tmp/invoicecraftly-pypi-011/bin/python - <<'PY'
          import importlib.metadata
          import invoicecraftly
          import json
          import urllib.request

          assert importlib.metadata.version('invoicecraftly') == '0.1.1'
          assert invoicecraftly.INVOICECRAFTLY_SDK_VERSION == '0.1.1'

          with urllib.request.urlopen('https://pypi.org/pypi/invoicecraftly/0.1.1/json', timeout=20) as response:
              payload = json.load(response)

          info = payload['info']
          assert info['name'] == 'invoicecraftly'
          assert info['version'] == '0.1.1'
          description = info.get('description') or ''
          for stale in (
              'PyPI publication has not happened yet',
              'Install after publication',
              'preferred candidate',
          ):
              assert stale not in description, stale
          assert 'pip install invoicecraftly' in description

          expected = {
              'Homepage': 'https://invoicecraftly.com/',
              'Documentation': 'https://invoicecraftly.com/developers/',
              'Source': 'https://github.com/abaidurrehman/invoicecraftly-python',
              'Issues': 'https://github.com/abaidurrehman/invoicecraftly-python/issues',
          }
          for key, value in expected.items():
              assert info['project_urls'].get(key) == value, (key, info['project_urls'].get(key))

          print('PyPI invoicecraftly', importlib.metadata.version('invoicecraftly'))
          print('SDK', invoicecraftly.INVOICECRAFTLY_SDK_VERSION)
          print('Published metadata and long description verified')
          PY
