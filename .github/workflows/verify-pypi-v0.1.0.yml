name: Verify PyPI v0.1.0

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Clean registry install and import
        run: |
          python -m venv /tmp/invoicecraftly-pypi-smoke
          /tmp/invoicecraftly-pypi-smoke/bin/python -m pip install --upgrade pip
          /tmp/invoicecraftly-pypi-smoke/bin/python -m pip install --no-cache-dir --index-url https://pypi.org/simple invoicecraftly==0.1.0
          /tmp/invoicecraftly-pypi-smoke/bin/python - <<'PY'
          import importlib.metadata
          import invoicecraftly

          assert importlib.metadata.version('invoicecraftly') == '0.1.0'
          assert invoicecraftly.INVOICECRAFTLY_SDK_VERSION == '0.1.0'
          print('PyPI invoicecraftly', importlib.metadata.version('invoicecraftly'))
          print('SDK', invoicecraftly.INVOICECRAFTLY_SDK_VERSION)
          print('Module', invoicecraftly.__file__)
          PY
