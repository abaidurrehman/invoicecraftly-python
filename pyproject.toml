[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "invoicecraftly"
version = "0.1.0"
description = "Official Python client for the InvoiceCraftly Developer Document API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["invoice", "invoicing", "pdf", "api-client", "en16931"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed"
]
dependencies = []

[project.urls]
Homepage = "https://invoicecraftly.com/"
Documentation = "https://invoicecraftly.com/developers/"
Source = "https://github.com/abaidurrehman/invoicecraftly-python"
Issues = "https://github.com/abaidurrehman/invoicecraftly-python/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
invoicecraftly = ["py.typed"]
